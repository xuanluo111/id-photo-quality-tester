name: Playwright Tests
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      working-directory: ./e2e-tests
      run: npm ci
    - name: Install Playwright Browsers
      working-directory: ./e2e-tests
      run: npx playwright install --with-deps

    # 启动前端 (http-server)
    - name: Start frontend
      run: |
        cd frontend
        npx http-server -p 3000 &
        sleep 3    # 等待服务启动  

    # 可选：启动后端 Flask
    - name: Start backend
      run: |
        cd backend
        python3 -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        python3 app.py &
        sleep 5       

    - name: Run Playwright tests
      working-directory: ./e2e-tests
      run: npx playwright test
      # 确保测试运行，即使失败也继续上传报告
      continue-on-error: true

    - name: Check report generated
      run: |
        echo "=== e2e-tests 目录内容 ==="
        ls -la ./e2e-tests/
        echo "=== playwright-report 目录 ==="
        ls -la ./e2e-tests/playwright-report/ 2>/dev/null || echo "❌ 目录不存在"
        echo "=== 查找所有 HTML 文件 ==="
        find ./e2e-tests -name "*.html" 2>/dev/null
      if: always()
  
    - uses: actions/upload-artifact@v5
      if: always() # ← 关键：无论测试成败都上传
      with:
        name: playwright-report
        path: ./e2e-tests/playwright-report/
        retention-days: 30

    - name: Deploy report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./e2e-tests/playwright-report
        destination_dir: ./report/${{ github.run_id }}