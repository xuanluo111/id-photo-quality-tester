name: Playwright Tests
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      working-directory: ./e2e-tests
      run: npm ci
    - name: Install Playwright Browsers
      working-directory: ./e2e-tests
      run: npx playwright install --with-deps

    # 启动前端 (http-server)
    - name: Start frontend
      run: |
        cd frontend
        npx http-server -p 3000 &
        sleep 3    # 等待服务启动  

    # 可选：启动后端 Flask
    - name: Start backend
      run: |
        cd backend
        python3 -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        python3 app.py &
        sleep 5       

    - name: Run Playwright tests
      working-directory: ./e2e-tests
      run: npx playwright test
      # 确保测试运行，即使失败也继续上传报告
      continue-on-error: true
  
    - uses: actions/upload-artifact@v5
      if: always() # ← 关键：无论测试成败都上传
      with:
        name: playwright-report
        path: ./e2e-tests/playwright-report/
        retention-days: 30
  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 需要写入权限以推送到 gh-pages 分支
    steps:
    - name: Download report artifact
      uses: actions/download-artifact@v4
      with:
        name: playwright-report
        path: playwright-report   # 解压到当前工作目录下的 playwright-report

    - name: Deploy report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        destination_dir: ./reports/${{ github.run_id }}   # 可选：保留历史报告
        keep_files: false         # 是否保留旧文件（设为 false 会清空 gh-pages 分支上之前的文件，但不会影响其他子目录）
        force_orphan: false      

