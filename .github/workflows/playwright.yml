name: Playwright Tests
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.59.1-jammy   # 镜像里已经包含浏览器和依赖
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      working-directory: ./e2e-tests
      run: npm ci
    
    # 可选：启动后端 Flask
    - name: Start backend
      run: |
        cd backend
        # python3 -m venv venv
        # source venv/bin/activate
        apt update
        apt install -y python3-pip
        python3 -m pip install --upgrade pip
        python3 -m pip install -r requirements.txt
        python3 app.py &
        sleep 5     

    - name: Run Playwright tests
      working-directory: ./e2e-tests
      env:
        HOME: /root
      run: npx playwright test --grep-invert "LLM|大模型"
      # 确保测试运行，即使失败也继续上传报告
      continue-on-error: true
  
    - uses: actions/upload-artifact@v5
      if: always() # ← 关键：无论测试成败都上传
      with:
        name: playwright-report
        path: ./e2e-tests/playwright-report/
        retention-days: 30

    - name: Deploy report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./e2e-tests/playwright-report
        destination_dir: ./latest
        force_orphan: true
    
    - name: Send FeiShu notification on failure
      if: steps.test.outcome == 'failure'
      env:
        WEBHOOK_URL: ${{secrets.FEISHU_WEBHOOK_XUANLUO}}
      run: |
        curl -X POST -H "Content-Type: application/json" -d '{
          "msg_type": "post",
          "content": {
            "post": {
              "zh_cn": {
                "title": "PlayWright 测试失败",
                "content": [
                  [
                    {"tag": "text", "text":"仓库："},
                    {"tag": "a", "href": "${{ github.server_url }}/${{ github.repository }}", "text": "${{ github.repository }}"}
                  ],
                  [
                    {"tag": "text", "text": "分支："},
                    {"tag": "text", "text": "${{ github.ref_name }}"}
                  ],
                  [
                    {"tag": "text", "text":"提交者："},
                    {"tag": "text", "text":"${{ github.actor }}"}
                  ],
                  [
                    {"tag": "a", "href": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "text": "点击查看详情"}
                  ]
                ]
              }
            }
          }
        }' $WEBHOOK_URL

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 需要写入权限以推送到 gh-pages 分支
    steps:
    - name: Download report artifact
      uses: actions/download-artifact@v4
      with:
        name: playwright-report
        path: ./e2e-tests/playwright-report   # 解压到当前工作目录下的 playwright-report

    - name: Deploy report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./e2e-tests/playwright-report
        destination_dir: ./reports/${{ github.run_id }}   # 可选：保留历史报告
        keep_files: false         # 是否保留旧文件（设为 false 会清空 gh-pages 分支上之前的文件，但不会影响其他子目录）
        force_orphan: false  
        
    - name: Output report URL
      run: |
        REPORT_URL="https://xuanluo111.github.io/id-photo-quality-tester/reports/${{ github.run_id }}/"
        echo "::notice title=📊 Playwright Test Report::$REPORT_URL"
        echo "### [点击查看测试报告]($REPORT_URL)" >> $GITHUB_STEP_SUMMARY